url: https://globalgov.github.io/manypkgs/
development:
    mode: auto
template:
  bootstrap: 5
  params:
    bootswatch: litera
authors:
  James Hollway:
    href: https://jameshollway.com
  Bernhard Bieri:
    href: https://bernhardbieri.ch
navbar:
  structure:
    left:
    - home
    - intro
    - reference
    - articles
    - news
    right:
    - packages
    - search
    - github
  components:
    home:
      icon: fa-home fa-lg
      aria-label: Home
      href: index.html
    reference:
      text: Reference
      href: reference/index.html
    articles:
      text: Articles
      menu:
      - text: Develop
        href: articles/contributor.html
      - text: Agreements
        href: articles/agreements.html
      - text: Text
        href: articles/treaties.html
    news:
      text: News
      href: news/index.html
    github:
      icon: "fab fa-github fa-lg"
      aria-label: GitHub
      href: https://github.com/globalgov/manypkgs
    packages:
      text: Other packages
      menu:
        - text: manydata
          href: https://globalgov.github.io/manydata/
        - text: manypkgs
          href: https://globalgov.github.io/manypkgs/
        - text: manystates
          href: https://globalgov.github.io/manystates/
        - text: manytreaties
          href: https://globalgov.github.io/manytreaties/
        - text: manyios
          href: https://globalgov.github.io/manyios/
        - text: manyenviron
          href: https://globalgov.github.io/manyenviron/
        - text: manytrade
          href: https://globalgov.github.io/manytrade/
reference:
  - title: "Setting up"
    desc: "Functions that set up and update a 'many' package."
    contents:
      - setup_package
      - update_package
      - add_author
      - add_bib
  - title: "Importing and exporting"
    desc: "Functions that bring data into a 'many' package and save it as a datacube."
    contents:
      - import_data
      - export_data
      - convert_pdf
  - title: "Coding agreements"
    desc: "Functions that code identifiers for international agreements."
    contents:
      - starts_with("code_")
      - condense_agreements
  - title: "Developing"
    desc: "Functions that help with the development of R packages."
    contents:
      - depends
      - retain
      - call_cran
      - starts_with("find_")
      - group_functions
      - functions_work
      - print_help
      - evaluate_bugs
      - bigo_net
      - tutorials
  - title: "Defunct"
    contents:
      - defunct
footer:
  structure:
    left: devs
    right: panarchic
  components:
    devs: Developed by [James Hollway](https://jameshollway.com/).
    panarchic: Part of the [PANARCHIC project](https://panarchic.ch/).
